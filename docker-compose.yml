services:
  bot:
    build: .
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - .:/app

    # resource limits (correct format)
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    stop_grace_period: 30s
